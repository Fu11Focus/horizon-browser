<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>minibrowser</title>
</head>
<body>
  <div id="tabs"></div>
  <div id="toolbar">
    <button id="back"    class="nav" title="Back">‹</button>
    <button id="fwd"     class="nav" title="Forward">›</button>
    <button id="reload"  class="nav" title="Reload">⟳</button>
    <input  id="addr"    type="text" spellcheck="false" autocomplete="off"
            placeholder="Search or enter address">
    <button id="newtab"  class="nav" title="New tab (⌘T)">+</button>
    <button id="devtools" class="nav" title="DevTools (⌘⌥I)">&#8942;</button>
    <button id="profile"  class="nav" title="Profiles">●</button>
  </div>
  <div id="profiles" hidden>
    <span class="panel-label">Profile:</span>
    <div id="profile-chips"></div>
    <input id="profile-name" type="text" spellcheck="false" autocomplete="off" placeholder="New profile…">
    <button id="profile-create" class="nav" title="Create &amp; open">＋</button>
  </div>
  <div id="find" hidden>
    <input id="find-input" type="text" spellcheck="false" autocomplete="off" placeholder="Find on page">
    <span id="find-count">0/0</span>
    <button id="find-prev"  class="nav" title="Previous (⇧⏎)">‹</button>
    <button id="find-next"  class="nav" title="Next (⏎)">›</button>
    <button id="find-close" class="nav" title="Close (Esc)">×</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
