<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Horizon</title>
</head>
<body>
  <div id="tabs"></div>
  <div id="toolbar">
    <button id="back" class="nav" title="Back" aria-label="Back">
      <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="fwd" class="nav" title="Forward" aria-label="Forward">
      <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button id="reload" class="nav" title="Reload (⌘R)" aria-label="Reload">
      <svg viewBox="0 0 24 24" class="ico sm" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
    <label id="addr-wrap">
      <svg id="addr-lock" viewBox="0 0 24 24" class="ico xs" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <svg id="addr-search" viewBox="0 0 24 24" class="ico xs" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      <input id="addr" type="text" spellcheck="false" autocomplete="off"
             placeholder="Search or enter address" aria-label="Address">
    </label>
    <button id="zoom" class="nav" title="Reset zoom to 100% (⌘0)" aria-label="Reset zoom" hidden>100%</button>
    <button id="profile" class="nav" title="Profiles" aria-label="Profiles"><span class="avatar"></span></button>
    <button id="devtools" class="nav" title="Developer tools (⌘⌥I)" aria-label="Developer tools">
      <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg>
    </button>
  </div>
  <div id="profiles" hidden>
    <div id="profile-chips"></div>
    <label id="profile-new">
      <svg viewBox="0 0 24 24" class="ico xs" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <input id="profile-name" type="text" spellcheck="false" autocomplete="off" placeholder="New profile" aria-label="New profile name">
    </label>
    <button id="profile-create" class="nav" title="Create &amp; open profile" aria-label="Create profile">
      <svg viewBox="0 0 24 24" class="ico sm" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button id="profile-window" class="btn" title="New window, same profile (⌘N)">New window</button>
    <button id="profile-incognito" class="btn" title="New private window (⇧⌘N)">
      <svg viewBox="0 0 24 24" class="ico xs" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><path d="M4 4l16 16"/></svg>
      Private window
    </button>
  </div>
  <div id="password" hidden>
    <svg viewBox="0 0 24 24" class="ico sm accent" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></svg>
    <span id="password-text"></span>
    <button id="password-never"   class="btn">Never</button>
    <button id="password-dismiss" class="btn">Not now</button>
    <button id="password-save"    class="btn-primary">Save</button>
  </div>
  <div id="find" hidden>
    <div id="find-box">
      <svg viewBox="0 0 24 24" class="ico xs" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      <input id="find-input" type="text" spellcheck="false" autocomplete="off" placeholder="Find on page" aria-label="Find on page">
      <span id="find-count">0/0</span>
      <span class="sep" aria-hidden="true"></span>
      <button id="find-prev"  class="nav" title="Previous (⇧⏎)" aria-label="Previous match">
        <svg viewBox="0 0 24 24" class="ico sm" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <button id="find-next"  class="nav" title="Next (⏎)" aria-label="Next match">
        <svg viewBox="0 0 24 24" class="ico sm" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button id="find-close" class="nav" title="Close (Esc)" aria-label="Close find">
        <svg viewBox="0 0 24 24" class="ico xs" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
